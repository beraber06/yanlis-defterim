name: APK

# Android paketini (android/ klasörü) derler ve "apk" sürümüne yükler.
# İndirme adresi: https://github.com/beraber06/yanlis-defterim/releases/latest/download/yanlis-defterim.apk
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'android/**'
      - '.github/workflows/apk.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      # The signing key is made for this build only and is never stored.
      - name: Make a signing key
        run: |
          KS_PASS=$(openssl rand -hex 16)
          echo "::add-mask::$KS_PASS"
          echo "KS_PASS=$KS_PASS" >> "$GITHUB_ENV"
          echo "KS_FILE=$RUNNER_TEMP/yd.jks" >> "$GITHUB_ENV"
          keytool -genkeypair -keystore "$RUNNER_TEMP/yd.jks" -storepass "$KS_PASS" -keypass "$KS_PASS" \
            -alias yd -keyalg RSA -keysize 2048 -validity 20000 -dname "CN=Yanlis Defterim"

      - name: Build
        working-directory: android
        run: gradle --no-daemon assembleRelease

      - name: Check signature
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk yanlis-defterim.apk
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          "$BT/apksigner" verify --print-certs yanlis-defterim.apk | tee certs.txt
          grep -i 'SHA-256' certs.txt | head -1 | sed 's/.*: //' > sha256.txt
          ls -la yanlis-defterim.apk

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SHA=$(cat sha256.txt)
          gh release delete apk --yes --cleanup-tag || true
          gh release create apk yanlis-defterim.apk --latest \
            --title "Yanlış Defterim APK" \
            --notes "Android kurulum dosyası. İmza (SHA-256): $SHA"
